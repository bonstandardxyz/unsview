name: conda build

# Builds the conda package and, on a version tag, uploads it to anaconda.org.
#
# Setup required once, in the repo's Settings -> Secrets and variables -> Actions:
#   ANACONDA_TOKEN   a token from https://anaconda.org/<you>/settings/access
#                    with "Allow write access to the API site" enabled.
# The package uploads to whichever account owns the token, so no username is
# hardcoded here. Without the secret set, builds still run and publish their
# artifacts to the Actions run; only the upload step is skipped.
#
# Users then install with:  conda install -c <your-channel> unsview

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['recipe/**', 'src/**', 'Makefile', '.github/workflows/conda-build.yml']
  workflow_dispatch:

jobs:
  linux-64:
    runs-on: ubuntu-latest
    # Build inside the conda-forge image rather than bare ubuntu-latest. The
    # toolchain there targets an old sysroot, so the binary runs on the aging
    # glibc found on HPC login nodes. A bare-runner build would link against
    # the runner's much newer glibc and fail on exactly the systems we target.
    container: condaforge/linux-anvil-x86_64:alma9
    env:
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
    defaults:
      run:
        # A login shell, matching osx-arm64. Without it GitHub runs each step
        # under `sh -e`, which never sources /opt/conda/etc/profile.d/conda.sh,
        # so nothing in the image's conda prefix -- conda and git alike -- is on
        # PATH and every step dies with 127 before the build starts.
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Mark workspace safe for git
        # Quiets git's dubious-ownership refusal when the checkout uid differs
        # from the container's. Tolerant of a missing git because nothing here
        # needs it: the version is a literal in meta.yaml and the source is a
        # local path.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
      - name: Install conda-build
        run: conda install -y -n base -c conda-forge conda-build anaconda-client
      - name: Build
        run: |
          set -o pipefail
          conda build recipe -c conda-forge --output-folder ./build-artifacts 2>&1 \
            | tee /tmp/build.log
      - name: Confirm the X11 GUI was compiled in
        # A headless binary installs and renders PNGs exactly like a GUI one, so
        # nothing downstream would notice it shipped. Both platforms are checked.
        run: |
          grep -q "X11 GUI: enabled" /tmp/build.log \
            || { echo "::error::Linux build produced a headless binary"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: conda-linux-64
          path: build-artifacts/linux-64/*.conda
      - name: Upload to anaconda.org
        if: startsWith(github.ref, 'refs/tags/v') && env.ANACONDA_TOKEN != ''
        run: anaconda -t "$ANACONDA_TOKEN" upload --force build-artifacts/linux-64/*.conda

  osx-arm64:
    runs-on: macos-14
    env:
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-update-conda: true
      - name: Install conda-build
        run: conda install -y -n base -c conda-forge conda-build anaconda-client
      - name: Build
        run: |
          set -o pipefail
          conda build recipe -c conda-forge --output-folder ./build-artifacts 2>&1 \
            | tee /tmp/build.log
      - name: Confirm the X11 GUI was compiled in
        # conda-forge ships osx-64/osx-arm64 xorg-libxaw, so macOS gets the GUI
        # too. It needs XQuartz at runtime for the X server, but that is the
        # user's side -- the package itself must carry the GUI.
        run: |
          grep -q "X11 GUI: enabled" /tmp/build.log \
            || { echo "::error::macOS build produced a headless binary"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: conda-osx-arm64
          path: build-artifacts/osx-arm64/*.conda
      - name: Upload to anaconda.org
        if: startsWith(github.ref, 'refs/tags/v') && env.ANACONDA_TOKEN != ''
        run: anaconda -t "$ANACONDA_TOKEN" upload --force build-artifacts/osx-arm64/*.conda

  release:
    # Attach both packages to the GitHub Release, so anyone can download them
    # with plain curl. The build jobs already publish Actions artifacts, but
    # fetching one of those needs an authenticated token even on a public repo
    # (an anonymous request gets HTTP 401) -- release assets have no such
    # restriction, and requiring an account to download from a public project
    # is a bad deal. This runs on the bare runner rather than inside either
    # build job: the alma9 container has no gh, and doing it once here covers
    # both platforms after both have succeeded.
    needs: [linux-64, osx-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # The repository default is read-only, so creating and uploading to a
      # release must be requested explicitly. Nothing else needs write.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Name the packages after their platform
        # conda names files by build hash -- unsview-0.1.0-h9bf148f_0.conda and
        # unsview-0.1.0-h8a0c2ca_0.conda -- which tells a downloader nothing
        # about which is which. Rename to the platform subdir instead. conda
        # installs a renamed file happily: it reads name/version/build from the
        # metadata inside the package, not from the filename.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p upload
          for d in dist/conda-*; do
              sub="${d#dist/conda-}"
              cp "$d"/*.conda "upload/unsview-${VERSION}-${sub}.conda"
          done
          ls -l upload
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks the repo out -- it only needs the two build
          # artifacts -- so gh has no git remote to infer the repository from
          # and fails with "not a git repository". Naming it explicitly is
          # cheaper than cloning the tree just to satisfy that lookup.
          GH_REPO: ${{ github.repository }}
        # A tag push does not create a release by itself, so make one if it is
        # not already there. --clobber lets a re-run replace assets rather than
        # failing on a name that already exists.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                  --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" upload/*.conda --clobber
